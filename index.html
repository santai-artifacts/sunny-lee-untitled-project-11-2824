<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text-dark: #776e65;
    --text-light: #f9f6f2;
    --accent: #8f7a66;
    --accent-hover: #9f8b77;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100%;
    padding: 24px 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .title {
    font-size: clamp(48px, 14vw, 64px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score-box {
    background: var(--board);
    border-radius: var(--radius);
    padding: 8px 16px;
    text-align: center;
    color: var(--text-light);
    min-width: 84px;
    position: relative;
    overflow: hidden;
  }

  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #eee4da;
  }

  .score-box .value {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.15;
  }

  .score-add {
    position: absolute;
    right: 12px;
    top: 8px;
    font-size: 18px;
    font-weight: 800;
    color: rgba(119, 110, 101, 0.9);
    animation: scoreAdd 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes scoreAdd {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-28px); }
  }

  .subhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .subhead p {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text-dark);
    max-width: 60%;
  }
  .subhead p b { color: var(--accent); }

  .btn {
    background: var(--accent);
    color: var(--text-light);
    border: none;
    border-radius: var(--radius);
    padding: 11px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 3px solid rgba(143,122,102,0.4); outline-offset: 2px; }

  .board-wrap {
    position: relative;
    background: var(--board);
    border-radius: 12px;
    padding: var(--gap, 12px);
    touch-action: none;
  }

  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap, 12px);
  }

  .grid-cell {
    background: var(--cell);
    border-radius: var(--radius);
    aspect-ratio: 1 / 1;
  }

  .tiles {
    position: absolute;
    inset: var(--gap, 12px);
  }

  .tile {
    position: absolute;
    width: var(--tile-size);
    height: var(--tile-size);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    font-weight: 800;
    font-size: 34px;
    background: #eee4da;
    color: var(--text-dark);
    transition: transform 0.12s ease-in-out;
    will-change: transform;
    user-select: none;
  }

  .tile-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .tile.new .tile-inner { animation: appear 0.18s ease-out; }
  .tile.merged .tile-inner { animation: pop 0.18s ease-in-out; }

  @keyframes appear {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* Tile colors */
  .t2    { background: #eee4da; color: #776e65; }
  .t4    { background: #ede0c8; color: #776e65; }
  .t8    { background: #f2b179; color: #f9f6f2; }
  .t16   { background: #f59563; color: #f9f6f2; }
  .t32   { background: #f67c5f; color: #f9f6f2; }
  .t64   { background: #f65e3b; color: #f9f6f2; }
  .t128  { background: #edcf72; color: #f9f6f2; font-size: 30px; }
  .t256  { background: #edcc61; color: #f9f6f2; font-size: 30px; }
  .t512  { background: #edc850; color: #f9f6f2; font-size: 30px; }
  .t1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; box-shadow: 0 0 24px rgba(237,194,46,0.6); }
  .tsuper{ background: #3c3a32; color: #f9f6f2; font-size: 20px; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.72);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 5;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay.win { background: rgba(237, 194, 46, 0.55); }
  .overlay .msg {
    font-size: 44px;
    font-weight: 900;
    color: var(--text-dark);
    letter-spacing: -1px;
  }
  .overlay.win .msg { color: #f9f6f2; }
  .overlay-actions { display: flex; gap: 10px; }

  footer {
    margin-top: 20px;
    font-size: 13px;
    color: #a89b8c;
    text-align: center;
    line-height: 1.5;
  }
  footer kbd {
    background: #efe8dd;
    border: 1px solid #d8cdbf;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dark);
  }

  @media (max-width: 400px) {
    .tile { font-size: 28px; }
    .t128, .t256, .t512 { font-size: 24px; }
    .overlay .msg { font-size: 34px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="subhead">
      <p>Join the tiles, get to <b>2048!</b></p>
      <button class="btn" id="new-game">New Game</button>
    </div>

    <div class="board-wrap" id="board">
      <div class="grid-bg" id="grid-bg"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <div class="msg" id="overlay-msg">Game Over</div>
        <div class="overlay-actions">
          <button class="btn" id="keep-going" style="display:none;">Keep going</button>
          <button class="btn" id="try-again">Try again</button>
        </div>
      </div>
    </div>

    <footer>
      Use <kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> or swipe to move.
      Tiles with the same number merge into one.
    </footer>
  </div>

<script>
(function () {
  "use strict";

  const SIZE = 4;
  const WIN_VALUE = 2048;
  const boardEl = document.getElementById("board");
  const tilesEl = document.getElementById("tiles");
  const gridBgEl = document.getElementById("grid-bg");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlayEl = document.getElementById("overlay");
  const overlayMsgEl = document.getElementById("overlay-msg");
  const keepGoingBtn = document.getElementById("keep-going");

  // State
  let grid = [];          // 2D array of tile objects or null
  let score = 0;
  let best = 0;
  let tileId = 0;
  let won = false;
  let over = false;
  let keepPlaying = false;
  let busy = false;

  // Build the static background cells
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement("div");
    c.className = "grid-cell";
    gridBgEl.appendChild(c);
  }

  // --- Layout: compute tile pixel size so absolute tiles line up with grid ---
  function layout() {
    const style = getComputedStyle(boardEl);
    const gap = parseFloat(style.getPropertyValue("--gap")) || 12;
    const inner = boardEl.clientWidth - gap * 2; // padding removed
    const tileSize = (inner - gap * (SIZE - 1)) / SIZE;
    boardEl.style.setProperty("--tile-size", tileSize + "px");
    boardEl.style.setProperty("--cell-step", (tileSize + gap) + "px");
    return { tileSize, gap };
  }

  function pos(r, c) {
    const step = parseFloat(getComputedStyle(boardEl).getPropertyValue("--cell-step"));
    return { x: c * step, y: r * step };
  }

  // --- Grid helpers ---
  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) cells.push({ r, c });
    return cells;
  }

  function addRandomTile() {
    const cells = emptyCells();
    if (!cells.length) return null;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = { id: tileId++, value, r, c, isNew: true, merged: false, el: null };
    grid[r][c] = tile;
    return tile;
  }

  // --- Rendering ---
  function classForValue(v) {
    if (v <= 2048) return "t" + v;
    return "tsuper";
  }

  function createTileEl(tile) {
    const el = document.createElement("div");
    el.className = "tile " + classForValue(tile.value);
    const inner = document.createElement("div");
    inner.className = "tile-inner";
    inner.textContent = tile.value;
    el.appendChild(inner);
    const { x, y } = pos(tile.r, tile.c);
    el.style.transform = `translate(${x}px, ${y}px)`;
    tilesEl.appendChild(el);
    tile.el = el;
    return el;
  }

  function renderNew() {
    // Full render from scratch (used on new game)
    tilesEl.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = grid[r][c];
        if (tile) {
          createTileEl(tile);
          if (tile.isNew) {
            tile.el.classList.add("new");
            tile.isNew = false;
          }
        }
      }
    }
  }

  function updateTileEl(tile) {
    const el = tile.el;
    el.className = "tile " + classForValue(tile.value);
    el.querySelector(".tile-inner").textContent = tile.value;
    const { x, y } = pos(tile.r, tile.c);
    el.style.transform = `translate(${x}px, ${y}px)`;
  }

  // --- Move logic ---
  // direction: 'up','down','left','right'
  function move(dir) {
    if (busy || over) return;
    if (won && !keepPlaying) return;

    const vectors = {
      left:  { dr: 0, dc: -1 },
      right: { dr: 0, dc: 1 },
      up:    { dr: -1, dc: 0 },
      down:  { dr: 1, dc: 0 },
    };
    const v = vectors[dir];

    // Traversal order: process cells in the direction of movement
    const rows = [...Array(SIZE).keys()];
    const cols = [...Array(SIZE).keys()];
    if (v.dr === 1) rows.reverse();
    if (v.dc === 1) cols.reverse();

    let moved = false;
    let gained = 0;
    const toRemove = [];

    // Reset merged flags
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) grid[r][c].merged = false;

    for (const r of rows) {
      for (const c of cols) {
        const tile = grid[r][c];
        if (!tile) continue;

        let nr = r, nc = c;
        // Find farthest position
        while (true) {
          const tr = nr + v.dr, tc = nc + v.dc;
          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
          const target = grid[tr][tc];
          if (!target) {
            nr = tr; nc = tc;
          } else if (target.value === tile.value && !target.merged && !tile.merged) {
            // Merge into target
            nr = tr; nc = tc;
            break;
          } else {
            break;
          }
        }

        const dest = grid[nr][nc];
        if (dest && dest !== tile && dest.value === tile.value && !dest.merged) {
          // Merge
          grid[r][c] = null;
          dest.value *= 2;
          dest.merged = true;
          tile.r = nr; tile.c = nc;      // slide onto target then remove
          toRemove.push(tile);
          gained += dest.value;
          if (dest.value === WIN_VALUE && !won) won = true;
          moved = true;
        } else if (nr !== r || nc !== c) {
          // Slide
          grid[r][c] = null;
          grid[nr][nc] = tile;
          tile.r = nr; tile.c = nc;
          moved = true;
        }
      }
    }

    if (!moved) return;

    busy = true;

    // Animate slides
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) updateTileEl(grid[r][c]);

    // Move merged-away tiles onto their destination too
    for (const t of toRemove) {
      const { x, y } = pos(t.r, t.c);
      t.el.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Score
    if (gained > 0) {
      score += gained;
      showScoreAdd(gained);
      updateScore();
    }

    // After slide transition completes, finalize
    setTimeout(() => {
      // Remove merged-away tiles
      for (const t of toRemove) t.el.remove();

      // Pop animation on merged tiles + update text/color
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const tile = grid[r][c];
          if (tile && tile.merged) {
            tile.el.classList.remove("merged");
            void tile.el.offsetWidth; // reflow to restart animation
            tile.el.classList.add("merged");
          }
        }
      }

      // Spawn a new tile
      const t = addRandomTile();
      if (t) {
        createTileEl(t);
        t.el.classList.add("new");
        t.isNew = false;
      }

      busy = false;

      // Win / lose checks
      if (won && !keepPlaying) {
        showOverlay("You win!", true);
      } else if (!movesAvailable()) {
        over = true;
        showOverlay("Game Over", false);
      }
    }, 130);
  }

  function movesAvailable() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
        if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
      }
    }
    return false;
  }

  // --- Score display ---
  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
  }

  function showScoreAdd(amount) {
    const el = document.createElement("div");
    el.className = "score-add";
    el.textContent = "+" + amount;
    scoreEl.parentElement.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  // Best score persistence (in-memory fallback if storage blocked)
  let memBest = 0;
  function saveBest() {
    try { localStorage.setItem("best2048", String(best)); }
    catch (e) { memBest = best; }
  }
  function loadBest() {
    try {
      const v = localStorage.getItem("best2048");
      best = v ? parseInt(v, 10) || 0 : 0;
    } catch (e) { best = memBest; }
    bestEl.textContent = best;
  }

  // --- Overlay ---
  function showOverlay(msg, win) {
    overlayMsgEl.textContent = msg;
    overlayEl.classList.toggle("win", win);
    overlayEl.classList.add("show");
    keepGoingBtn.style.display = win ? "" : "none";
  }
  function hideOverlay() {
    overlayEl.classList.remove("show");
  }

  // --- Game control ---
  function newGame() {
    grid = emptyGrid();
    score = 0;
    won = false;
    over = false;
    keepPlaying = false;
    busy = false;
    tileId = 0;
    updateScore();
    hideOverlay();
    layout();
    addRandomTile();
    addRandomTile();
    renderNew();
  }

  // --- Input: keyboard ---
  const keyMap = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
    h: "left", l: "right", k: "up", j: "down",
  };
  window.addEventListener("keydown", (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // --- Input: touch swipe ---
  let touchStart = null;
  boardEl.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  boardEl.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if (Math.max(absX, absY) < threshold) { touchStart = null; return; }
    if (absX > absY) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
    touchStart = null;
  }, { passive: true });

  // --- Buttons ---
  document.getElementById("new-game").addEventListener("click", newGame);
  document.getElementById("try-again").addEventListener("click", newGame);
  keepGoingBtn.addEventListener("click", () => {
    keepPlaying = true;
    hideOverlay();
  });

  // --- Resize handling: reposition tiles ---
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      layout();
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c]) {
            const { x, y } = pos(grid[r][c].r, grid[r][c].c);
            grid[r][c].el.style.transition = "none";
            grid[r][c].el.style.transform = `translate(${x}px, ${y}px)`;
            void grid[r][c].el.offsetWidth;
            grid[r][c].el.style.transition = "";
          }
    }, 100);
  });

  // Init
  loadBest();
  newGame();
})();
</script>
</body>
</html>
